<div id="gpk-locations-map-widget" class="locations-map-section">
    <div class="locations-map-container" id="locationsMap">

        <!-- LEFT PANEL -->
        <aside class="locations-panel" role="complementary" aria-label="Locations list">
            <header class="locations-panel-header">
                <h1 class="locations-title">
                    Explore <strong class="text-green">our locations</strong>
                </h1>
            </header>

            <div class="locations-search" role="search" aria-label="Search locations">
                <div class="search-wrapper">
                    <input type="search" class="search-input" id="locationSearch" placeholder="Search location"
                        aria-label="Search location" autocomplete="off">
                    <span class="search-icon" aria-hidden="true">
                        <img src="widgets/locations-map/images/search-icon.svg" alt="Search">
                    </span>
                </div>
            </div>

            <div class="locations-filters" role="group" aria-label="Filter by location type">
                <p class="filters-label">Filter by category</p>
                <div class="filters-tags" id="filterTags" role="radiogroup" aria-label="Location categories">
                    <!-- Dynamic tags -->
                </div>
            </div>

            <div class="locations-list" id="locationsList" role="list" aria-label="Available locations">
                <!-- Dynamic cards -->
            </div>
        </aside>

        <!-- RIGHT PANEL - INTERACTIVE MAP (Leaflet) -->
        <main class="map-container" role="main" aria-label="Locations map">
            <div id="gpkMap" class="gpk-map" aria-label="Interactive map of Grupak locations"></div>
        </main>
    </div>
</div>
