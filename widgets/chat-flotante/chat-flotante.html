<aside
    id="gpk-floating-chat"
    class="gpk-chat"
    aria-label="Asistente virtual de Grupak"
    data-gpk-chat-widget
>
    <section
        id="gpk-chat-panel"
        class="gpk-chat__panel"
        aria-labelledby="gpk-chat-title"
        aria-hidden="true"
        data-gpk-chat-panel
        hidden
    >
        <header class="gpk-chat__header" data-gpk-chat-header>
            <span class="gpk-chat__avatar" aria-hidden="true">V</span>
            <span class="gpk-chat__identity">
                <h2 id="gpk-chat-title" class="gpk-chat__title">Valeria</h2>
                <span class="gpk-chat__subtitle">Asistente de Grupak</span>
            </span>
            <button
                class="gpk-chat__close"
                type="button"
                aria-label="Cerrar chat"
                data-gpk-chat-close
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12M18 6 6 18" />
                </svg>
            </button>
        </header>

        <div
            class="gpk-chat__content"
            role="region"
            aria-label="Contenido del chat"
            data-gpk-chat-content
        ></div>

        <footer class="gpk-chat__footer" data-gpk-chat-footer>
            <p>Estamos aquí para ayudarte</p>
        </footer>
    </section>

    <button
        class="gpk-chat__launcher"
        type="button"
        aria-label="Abrir chat con Valeria"
        aria-controls="gpk-chat-panel"
        aria-expanded="false"
        data-gpk-chat-launcher
    >
        <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 4.5C9 4.5 3.5 9.1 3.5 15c0 4.1 2.7 7.6 6.7 9.4l-.2 4 4-2.9c.7.1 1.3.1 2 .1 7 0 12.5-4.6 12.5-10.5S23 4.5 16 4.5Z" />
            <circle cx="10.5" cy="15.2" r="1.3" />
            <circle cx="16" cy="15.2" r="1.3" />
            <circle cx="21.5" cy="15.2" r="1.3" />
        </svg>
    </button>
</aside>
