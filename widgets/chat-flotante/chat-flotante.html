<aside
    id="gpk-floating-chat"
    class="gpk-chat"
    aria-label="Asistente virtual de Grupak"
    data-gpk-chat-widget
>
    <section
        id="gpk-chat-panel"
        class="gpk-chat__panel"
        aria-labelledby="gpk-chat-title"
        aria-hidden="true"
        data-gpk-chat-panel
        hidden
    >
        <header class="gpk-chat__header" data-gpk-chat-header>
            <h2 id="gpk-chat-title" class="gpk-chat__title">Valeria</h2>
        </header>

        <div
            class="gpk-chat__content"
            role="region"
            aria-label="Contenido del chat"
            data-gpk-chat-content
        ></div>

        <footer class="gpk-chat__footer" data-gpk-chat-footer>
            <p>Estamos aquí para ayudarte</p>
        </footer>
    </section>

    <button
        class="gpk-chat__launcher"
        type="button"
        aria-label="Abrir chat con Valeria"
        aria-controls="gpk-chat-panel"
        aria-expanded="false"
        data-gpk-chat-launcher
    >
        <span aria-hidden="true">Chat</span>
    </button>
</aside>
