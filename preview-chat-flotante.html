<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview chat flotante | Grupak</title>
    <link rel="stylesheet" href="widgets/chat-flotante/chat-flotante.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f7f9fb;
        }
        .preview-card {
            background: #fff;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 600px;
        }
        .btn-test {
            margin-top: 15px;
            padding: 10px 18px;
            background: #4e9f25;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="preview-card">
        <h1>Preview Chat Flotante (Valeria)</h1>
        <p style="margin-top: 10px; color: #555;">El botón verde flotante del chat se ubica en la esquina inferior derecha de la pantalla.</p>
        <button class="btn-test" type="button" onclick="var btn = document.querySelector('[data-gpk-chat-launcher]'); if(btn) btn.click();">
            Abrir / Cerrar Chat
        </button>
    </main>

    <div id="gpk-floating-chat-root"></div>
    <script src="widgets/chat-flotante/chat-flotante.js"></script>
</body>
</html>
